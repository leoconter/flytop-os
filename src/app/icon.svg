<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FlyTop OS">
  <!--
    Ícone da aba.

    O logo da plataforma é horizontal (760×235) e tem o "fly" em branco, feito
    para a barra lateral escura: encolhido a 16px viraria um borrão, e em aba de
    tema claro metade dele sumiria no fundo. Por isso a aba usa o símbolo, não o
    logo — o avião, na cor exata da marca (#ee5d03, tirada do próprio PNG).

    O fundo sólido é o que garante o contraste nos dois temas de navegador; um
    avião solto ficaria invisível numa aba clara.
  -->
  <rect width="64" height="64" rx="14" fill="#ee5d03"/>
  <!-- scale: afasta as pontas das asas da borda arredondada, que corta o
       desenho no canto quando o sistema aplica a própria máscara. -->
  <g transform="rotate(38 32 32) translate(32 32) scale(0.84) translate(-32 -32)">
    <!-- Avião visto de cima, nariz para o alto: a silhueta que sobrevive a 16px. -->
    <path fill="#fff" d="M32 9c1.7 0 3 3.1 3 7v9.6l19.5 11.3v4.6L35 35.6v9.9l5.4 4.3v3.4L32 50.6l-8.4 2.6v-3.4l5.4-4.3v-9.9L9.5 41.5v-4.6L29 25.6V16c0-3.9 1.3-7 3-7z"/>
  </g>
</svg>
